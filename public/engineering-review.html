<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工程款匯入前檢查</title><style>body{margin:0;background:#f6f7f3;color:#26382d;font-family:-apple-system,"PingFang TC",sans-serif}.wrap{max-width:690px;margin:auto;padding:24px 18px}h1{font-size:25px}article{border:1px solid #e0e6dc;background:white;border-radius:18px;padding:18px;margin:15px 0}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:11px 5px;border-bottom:1px solid #e8ede7;text-align:left}td:last-child,th:last-child{text-align:right}.muted{color:#7a897d;font-size:13px;line-height:1.6}.warning{background:#fff4df;border-radius:12px;padding:14px;color:#95601e}button{border:0;background:#2b5740;color:#fff;border-radius:11px;padding:12px 18px;font-weight:700}.pill{display:inline-block;border-radius:22px;padding:7px 11px;background:#e9f2ea;font-size:12px}a{color:#315a40}</style></head><body><main class="wrap"><p class="muted"><a href="/">← 返回帳本</a></p><h1>工程約・前三期匯入檢查</h1><p class="pill">唯讀預覽 · 不會寫入或刪除任何紀錄</p><article><h2>預計新增的六筆</h2><table><thead><tr><th>期數與性質</th><th>金額</th></tr></thead><tbody id="lines"></tbody></table><h3>合計 NT$1,439,807</h3><p class="muted">六筆皆標記為已付款。日期尚未提供，暫不填寫。第三期未稅款 420,207 元，包含追加 21,632 元。</p></article><article><h2>現有資料核對</h2><div id="check">正在檢查既有帳本…</div></article><p class="muted">安全起見，此版本只提供檢查，不提供儲存。特別需要確認原本的「工程約」總項是否已有金額，避免六筆分期款與舊總項重複計算。</p></main><script>
const lines=[['第一期・含稅',74150],['第一期・未稅',398575],['第二期・含稅',74150],['第二期・未稅',398575],['第三期・含稅',74150],['第三期・未稅（含追加）',420207]];
const fmt=n=>'NT$'+n.toLocaleString('zh-TW');
document.querySelector('#lines').innerHTML=lines.map(([a,b])=>'<tr><td>'+a+'</td><td>'+fmt(b)+'</td></tr>').join('');
(async()=>{
const target=document.querySelector('#check');
try{
const res=await fetch('/api/data',{cache:'no-store'});if(!res.ok)throw Error('資料讀取失敗');
const data=await res.json();if(!data.ok||!Array.isArray(data.entries))throw Error('資料格式不正確');
const current=data.entries.filter(e=>String(e.item||'').includes('工程約'));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
target.innerHTML=current.length?'<div class="warning">找到 '+current.length+' 筆既有「工程約」紀錄。匯入前請確認下列紀錄是否與六筆分期款重疊。</div><table>'+current.map(e=>'<tr><td>'+esc(e.item)+'</td><td>'+fmt(Number(e.amount)||0)+'｜'+(e.paid?'已付款':'未付款')+'</td></tr>').join('')+'</table>':'<p>目前未發現名稱包含「工程約」的紀錄，但仍需確認是否有使用其他名稱登記的工程款。</p>';
}catch(e){target.innerHTML='<div class="warning">無法讀取資料，請確認雲端連線。沒有變更任何紀錄。</div>'}
})();
</script></body></html>
