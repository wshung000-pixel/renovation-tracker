<!doctype html>

<title>新家帳本｜裝潢與家電支出</title>
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;color:#27372f;background:#f7f7f3;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.wrap{max-width:890px;margin:auto;padding:24px 20px 125px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}.eyebrow{font-size:11px;letter-spacing:.17em;color:#8c958c;font-weight:700}.top h1{font-size:27px;letter-spacing:-.045em;margin:5px 0 0}.sync{border:1px solid #dae5dc;background:#eff7f0;border-radius:20px;padding:7px 11px;font-size:12px;color:#3e7351;white-space:nowrap}.hero{background:#234837;border-radius:23px;padding:26px;color:#fff;box-shadow:0 16px 35px #27463719}.hero small{color:#c6d9cb;font-size:13px}.money{font-size:clamp(32px,6vw,45px);font-weight:800;letter-spacing:-.035em;margin:10px 0 24px;overflow-wrap:anywhere}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;border-top:1px solid #ffffff30;padding-top:18px}.stats span{display:block;color:#c9dccd;font-size:12px;margin-bottom:7px}.stats strong{font-size:18px}.toolbar-head{display:flex;justify-content:space-between;align-items:center;margin:27px 0 13px}.toolbar-head h2{font-size:19px;letter-spacing:-.03em;margin:0}.sub{color:#8c958d;font-size:12px;margin-top:4px}.add{background:#234837;color:white;border:0;padding:12px 17px;border-radius:13px;font-weight:700}.tabs{display:grid;grid-template-columns:repeat(3,1fr);padding:5px;background:#e9ede7;border-radius:14px;gap:4px;margin-bottom:12px}.tabs button{border:0;background:transparent;border-radius:10px;padding:11px;color:#6e7a70;font-size:14px;font-weight:700}.tabs button.on{background:white;color:#234837;box-shadow:0 2px 6px #00000009}.filters{display:flex;gap:10px;margin-bottom:12px}.filters input,.filters select{min-width:0;background:white;border:1px solid #e1e7df;border-radius:13px;height:46px;padding:0 13px;outline-color:#659a78;font-size:15px}.filters input{flex:1}.filters select{max-width:133px}.list{background:white;border:1px solid #e5eae3;border-radius:17px;overflow:hidden}.entry{width:100%;display:flex;align-items:center;text-align:left;background:white;border:0;border-bottom:1px solid #eef0ec;padding:16px;gap:12px}.entry:last-child{border-bottom:0}.entry:active{background:#f5f8f3}.entry-text{flex:1;min-width:0}.entry-title{font-size:16px;font-weight:720;margin-bottom:5px;overflow-wrap:anywhere}.entry-note{font-size:12px;color:#8d978d;line-height:1.5;overflow-wrap:anywhere}.entry-amount{text-align:right;flex-shrink:0;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:3px 7px;margin-right:6px;background:#edf3ed;color:#49735a}.tag.unpaid{background:#fff2dd;color:#b07019}.empty{padding:55px 10px;text-align:center;color:#909b91}.small-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:19px}.link{background:none;border:0;color:#6c8272;text-decoration:underline;font-size:12px}.swipe-hint{text-align:center;color:#9ca79d;font-size:11px;margin:8px 0 12px}.category-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-bottom:15px}.category-card{text-align:left;background:#fff;border:1px solid #e4eae2;border-radius:17px;padding:17px;min-height:112px;color:#26382c}.category-card strong{display:block;font-size:16px;margin:10px 0 4px}.category-card span{font-size:12px;color:#819084}.category-icon{font-size:23px}.category-header{display:flex;align-items:center;gap:10px;margin-bottom:13px}.back{border:0;background:#e9efe7;border-radius:10px;padding:9px 11px;color:#375943;font-weight:700}.category-header h3{margin:0;font-size:17px}.category-header small{color:#8a958a}.hidden{display:none!important}.bottom-add{display:none}.overlay{position:fixed;inset:0;z-index:10;background:#17251c85;display:flex;align-items:center;justify-content:center;padding:17px}.dialog{width:100%;max-width:490px;max-height:94dvh;overflow:auto;background:white;border-radius:22px;padding:24px;box-shadow:0 25px 80px #0003}.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.dialog-head h2{margin:0;font-size:21px}.close{background:#eff1ed;border:0;border-radius:50%;width:34px;height:34px;font-size:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{margin:0 0 13px}.field label{display:block;color:#68766c;font-size:12px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{border:1px solid #dae3da;background:#fafbf9;border-radius:11px;width:100%;padding:12px;min-height:45px;font-size:16px;outline-color:#59936d}.field textarea{min-height:76px;resize:vertical}.buttons{display:flex;gap:9px;margin-top:13px}.btn{flex:1;border:1px solid #e1e8df;border-radius:12px;min-height:46px;font-size:15px;font-weight:700;background:white;color:#34523e}.btn.primary{background:#234837;color:white;border-color:#234837}.delete{display:block;margin:15px auto 0;background:none;border:0;color:#b44646;font-size:13px}.error{background:#fff0ee;color:#a34237;padding:9px 12px;font-size:12px;border-radius:10px;margin-top:12px}.notice{font-size:12px;color:#8d948c;margin-top:12px;line-height:1.5}@media(max-width:550px){.wrap{padding:20px 14px 110px}.top h1{font-size:24px}.hero{padding:23px 19px}.stats strong{font-size:15px}.stats span{font-size:11px}.toolbar-head .add{display:none}.bottom-add{display:block;position:fixed;z-index:3;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#234837;color:white;border:0;border-radius:99px;padding:16px 34px;box-shadow:0 10px 25px #173f2a50;font-weight:800;white-space:nowrap}.entry{padding:15px 12px;gap:8px}.entry-amount{font-size:15px}.grid{grid-template-columns:1fr 1fr}.dialog{padding:20px}.filters select{max-width:115px}}
.overlay{align-items:flex-end;padding:0}.dialog{display:flex;flex-direction:column;width:100%;max-width:520px;max-height:calc(100dvh - env(safe-area-inset-top) - 12px);border-radius:24px 24px 0 0;padding:0;overflow:hidden}.dialog-head{padding:19px 20px 13px;margin:0;border-bottom:1px solid #edf0eb;flex-shrink:0}.dialog-head h2{font-size:19px}.edit-form{display:flex;flex-direction:column;min-height:0;overflow:hidden}.form-scroll{padding:19px 20px 10px;overflow-y:auto;overscroll-behavior:contain;flex:1;min-height:0}.dialog .field{margin-bottom:14px}.dialog .field label{font-size:13px;margin-bottom:7px}.dialog .field input,.dialog .field select,.dialog .field textarea{background:#fff;min-height:48px}.primary-amount{font-size:24px!important;font-weight:800;color:#234837}.state-row{display:flex;gap:9px}.state-option{flex:1;border:1px solid #dfe7df;border-radius:12px;background:white;min-height:48px;font-weight:700;color:#6c7e71}.state-option.active{background:#e8f2e9;color:#245b38;border-color:#7ca987}.state-option.unpaid.active{background:#fff3df;color:#a46819;border-color:#e0b873}.extra-details{border-top:1px solid #edf0eb;margin-top:3px;padding-top:13px}.extra-details summary{font-weight:700;color:#536b59;padding:6px 0 14px;cursor:pointer;list-style:none}.extra-details summary:after{content:'⌄';float:right}.extra-details[open] summary:after{content:'⌃'}.form-footer{background:#fff;border-top:1px solid #edf0eb;padding:12px 20px calc(12px + env(safe-area-inset-bottom));flex-shrink:0}.form-footer .buttons{margin:0}.form-footer .btn{min-height:49px}.form-footer .delete{margin:12px auto 0}.form-tip{font-size:12px;color:#89978b;margin:-3px 0 14px}@media(min-width:600px){.overlay{align-items:center;padding:18px}.dialog{border-radius:22px;max-height:90dvh}.form-footer{padding-bottom:16px}}</style></head><body>
<main class="wrap"><header class="top"><div><div class="eyebrow">HOME / EXPENSE TRACKER</div><h1>新家裝潢帳本</h1></div><div class="sync" id="sync">連線中</div></header>
<section class="hero"><small>已付款總金額 · NT$</small><div class="money" id="paidTotal">—</div><div class="stats"><div><span>裝潢支出</span><strong id="renovationTotal">—</strong></div><div><span>家電支出</span><strong id="applianceTotal">—</strong></div><div><span>待付款項目</span><strong id="unpaidCount">—</strong></div></div></section>
<div class="toolbar-head"><div><h2>支出明細</h2><div class="sub" id="count">載入中</div></div><button class="add" id="addTop">＋ 新增項目</button></div>
<div id="overview"><div class="category-grid" id="categoryGrid"></div></div><div id="detail" class="hidden"><div class="category-header"><button class="back" id="back">← 總覽</button><div><h3 id="detailTitle">分類</h3><small id="detailCount"></small></div></div></div>
<div class="filters hidden" id="filters"><input id="search" placeholder="搜尋名稱、備註、付款方式…" aria-label="搜尋費用項目"><select id="statusFilter" aria-label="付款狀態"><option value="全部">全部狀態</option><option value="未付款">未付款</option><option value="已付款">已付款</option></select></div>
<div class="swipe-hint hidden" id="swipeHint">← 左右滑動可切換分類 →</div><div class="list hidden" id="list"><div class="empty">正在讀取資料…</div></div>
<div class="small-actions"><button class="link" id="export">匯出備份 JSON</button></div><div class="notice">點選項目可編輯。資料儲存於既有 Cloudflare 雲端空間。</div></main>
<button class="bottom-add" id="addBottom">＋ 新增項目</button><div id="modal"></div>
<script>
(function(){
'use strict';
var entries=[],ready=false,category='總覽',status='全部',query='',editing=null,busy=false;
var CATS=['設計與工程','家具','家電','設備與其他'];
var icons={'設計與工程':'⚒','家具':'▤','家電':'▣','設備與其他':'◈'};
function groupOf(e){if(CATS.includes(e.category))return e.category;var n=String(e.item||'');if(/設計|工程|驗屋|監工|泥作|油漆|木工|水電|拆除/.test(n))return '設計與工程';if(/沙發|床|餐桌|書桌|椅|茶几|家具|衣櫃|鞋櫃/.test(n))return '家具';if(/電視|soundbar|音響|洗衣|冰箱|冷氣|除濕|掃地|吸塵|烘衣|洗碗|烤箱|微波|電鍋/i.test(n))return '家電';return '設備與其他'}
var $=function(id){return document.getElementById(id)};
var money=function(n){return '＄'+Number(n||0).toLocaleString('zh-TW')};
var safe=function(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
function sync(t,bad){$('sync').textContent=t;$('sync').style.color=bad?'#ab4c39':'#3e7351';$('sync').style.background=bad?'#fff0eb':'#eff7f0'}
function cache(){try{localStorage.setItem('renovation-entries',JSON.stringify(entries))}catch(e){}}
async function load(){
try{
var res=await fetch('/api/data',{cache:'no-store'});if(!res.ok)throw Error('無法連線');var data=await res.json();
if(!data.ok||!Array.isArray(data.entries))throw Error('資料格式異常');
entries=data.entries;ready=true;cache();sync('✓ 已連線');render();
}catch(e){
try{var old=JSON.parse(localStorage.getItem('renovation-entries')||'null');if(Array.isArray(old)){entries=old;sync('離線檢視',true)}else sync('無法載入',true)}catch(_){sync('無法載入',true)}
ready=false;render();
}}
async function save(next){
if(!ready||busy){alert('目前無法儲存，請確認雲端連線後重新整理。');return false}
busy=true;sync('儲存中…');
try{
var res=await fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({entries:next})});
var data=await res.json();if(!res.ok||!data.ok)throw Error('儲存失敗');
entries=next;cache();sync('✓ 已儲存');render();return true;
}catch(e){sync('儲存失敗',true);alert('儲存失敗，原始清單未更動。請稍後再試。');return false}
finally{busy=false}
}
function render(){
var paid=entries.filter(function(e){return e.paid}),sum=function(a){return a.reduce(function(n,e){return n+(Number(e.amount)||0)},0)};
$('paidTotal').textContent=money(sum(paid));
$('renovationTotal').textContent=money(sum(paid.filter(function(e){return e.type==='裝潢'})));
$('applianceTotal').textContent=money(sum(paid.filter(function(e){return e.type==='家電'})));
$('unpaidCount').textContent=entries.filter(function(e){return !e.paid}).length+' 項';
var filtered=entries.filter(function(e){return (status==='全部'||(status==='已付款'&&e.paid)||(status==='未付款'&&!e.paid))&&(!query||[e.item,e.notes,e.payment].some(function(v){return String(v||'').toLowerCase().includes(query)}))});
$('overview').classList.toggle('hidden',category!=='總覽');$('detail').classList.toggle('hidden',category==='總覽');$('filters').classList.toggle('hidden',category==='總覽');$('list').classList.toggle('hidden',category==='總覽');$('swipeHint').classList.toggle('hidden',category==='總覽');
$('categoryGrid').innerHTML=CATS.map(function(t){var items=entries.filter(function(e){return groupOf(e)===t}),total=items.filter(function(e){return e.paid}).reduce(function(v,e){return v+(Number(e.amount)||0)},0);return '<button class="category-card" data-category="'+t+'"><div class="category-icon">'+icons[t]+'</div><strong>'+t+'</strong><span>'+items.length+' 項 · 已付 '+money(total)+'</span></button>'}).join('');
document.querySelectorAll('.category-card').forEach(function(b){b.onclick=function(){changeCategory(b.dataset.category)}});
if(category==='總覽'){$('count').textContent='4 大分類 · 共 '+entries.length+' 項';return}
var list=filtered.filter(function(e){return groupOf(e)===category});
$('detailTitle').textContent=category;$('detailCount').textContent=list.length+' 項';
$('count').textContent='顯示 '+list.length+' 筆 · 共 '+entries.length+' 筆';
$('list').innerHTML=list.length?list.map(function(e){
return '<button class="entry" data-id="'+safe(e.id)+'"><div class="entry-text"><div class="entry-title">'+safe(e.item||'未命名')+'</div><div class="entry-note"><span class="tag '+(!e.paid?'unpaid':'')+'">'+(e.paid?'已付款':'未付款')+'</span>'+safe(e.payment||'')+(e.date?' · '+safe(e.date):'')+'</div></div><div class="entry-amount">'+(Number(e.amount)?money(e.amount):'—')+'</div><span style="font-size:19px;color:#a5b0a7">›</span></button>'
}).join(''):'<div class="empty">沒有符合條件的項目</div>';
document.querySelectorAll('.entry').forEach(function(b){b.onclick=function(){openForm(entries.find(function(e){return String(e.id)===b.dataset.id}))}});

}
function openForm(e){
if(!ready){alert('目前為離線檢視，無法修改。');return}
editing=e||null;
var initialPaid=e?!!e.paid:false;
$('modal').innerHTML='<div class="overlay" id="overlay"><section class="dialog" role="dialog" aria-modal="true" aria-label="費用編輯">'+
'<div class="dialog-head"><h2>'+(e?'編輯項目':'新增項目')+'</h2><button class="close" id="close" aria-label="關閉">×</button></div>'+
'<form id="form" class="edit-form"><div class="form-scroll">'+
'<div class="field"><label for="item">項目名稱 *</label><input id="item" required maxlength="120" placeholder="例：工程約"></div>'+
'<div class="field"><label for="amount">金額 NT$</label><input type="number" class="primary-amount" id="amount" min="0" step="1" inputmode="numeric" placeholder="輸入金額"></div>'+
'<div class="field"><label>付款狀態</label><div class="state-row"><button type="button" class="state-option unpaid" data-paid="false">○ 尚未付款</button><button type="button" class="state-option" data-paid="true">✓ 已付款</button></div><input type="hidden" id="paid"></div>'+
'<div class="field"><label for="category">項目分類</label><select id="category"><option>設計與工程</option><option>家具</option><option>家電</option><option>設備與其他</option></select></div>'+
'<details class="extra-details" id="extra"><summary>更多資訊（付款方式、日期、備註）</summary>'+
'<div class="field"><label for="payment">付款方式</label><select id="payment"><option value="">未指定</option><option>轉帳</option><option>國泰信用卡</option><option>分期</option><option>現金</option><option>其他</option></select></div>'+
'<div class="field"><label for="date">日期</label><input id="date" type="date"></div>'+
'<div class="field"><label for="notes">備註</label><textarea id="notes" placeholder="廠牌、型號、其他補充資訊…"></textarea></div></details>'+
'</div><div class="form-footer"><div class="buttons"><button type="button" class="btn" id="cancel">取消</button><button class="btn primary" id="submit">儲存變更</button></div>'+(e?'<button type="button" class="delete" id="delete">刪除此項目</button>':'')+'</div></form></section></div>';
['item','amount','payment','date','notes'].forEach(function(k){$(k).value=e?(e[k]==null?'':e[k]):''});
$('category').value=e?groupOf(e):(CATS.includes(category)?category:'設備與其他');
$('paid').value=String(initialPaid);
function refreshPaid(){document.querySelectorAll('.state-option').forEach(function(b){b.classList.toggle('active',b.dataset.paid===$('paid').value)})}
document.querySelectorAll('.state-option').forEach(function(b){b.onclick=function(){$('paid').value=b.dataset.paid;refreshPaid()}});
refreshPaid();
if(e&&(e.payment||e.date||e.notes))$('extra').open=true;
function close(){$('modal').innerHTML='';editing=null}
$('close').onclick=close;$('cancel').onclick=close;
$('overlay').onclick=function(ev){if(ev.target===$('overlay'))close()};
$('form').onsubmit=async function(ev){
ev.preventDefault();var item=$('item').value.trim();if(!item)return;
var payload={id:e?e.id:String(Date.now())+'-'+Math.random().toString(36).slice(2,8),item:item,category:$('category').value,type:$('category').value==='家電'?'家電':'裝潢',amount:Number($('amount').value)||0,payment:$('payment').value,date:$('date').value,paid:$('paid').value==='true',notes:$('notes').value};
var next=e?entries.map(function(x){return String(x.id)===String(e.id)?Object.assign({},x,payload):x}):entries.concat([payload]);
$('submit').disabled=true;var ok=await save(next);if(ok)close();else $('submit').disabled=false;
};
if(e)$('delete').onclick=async function(){if(!confirm('確定刪除「'+(e.item||'此項目')+'」？此操作無法復原。'))return;var ok=await save(entries.filter(function(x){return String(x.id)!==String(e.id)}));if(ok)close()};
}
function changeCategory(t){category=t;status='全部';query='';$('search').value='';$('statusFilter').value='全部';render();window.scrollTo({top:0,behavior:'smooth'})}
$('back').onclick=function(){changeCategory('總覽')};
var swipeStart=null;
document.querySelector('.wrap').addEventListener('touchstart',function(e){if(e.touches.length!==1||e.target.closest('input,select,textarea,button,.overlay'))return;swipeStart={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});
document.querySelector('.wrap').addEventListener('touchend',function(e){if(!swipeStart||!e.changedTouches.length)return;var dx=e.changedTouches[0].clientX-swipeStart.x,dy=e.changedTouches[0].clientY-swipeStart.y;swipeStart=null;if(Math.abs(dx)<55||Math.abs(dx)<Math.abs(dy)*1.35)return;var pages=['總覽'].concat(CATS),i=pages.indexOf(category)+(dx<0?1:-1);if(i>=0&&i<pages.length)changeCategory(pages[i])},{passive:true});

$('search').oninput=function(ev){query=ev.target.value.trim().toLowerCase();render()};
$('statusFilter').onchange=function(ev){status=ev.target.value;render()};
$('addTop').onclick=$('addBottom').onclick=function(){openForm(null)};
$('export').onclick=function(){var blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),entries:entries},null,2)],{type:'application/json'});var url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='新家帳本備份-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(function(){URL.revokeObjectURL(url)},300)};
load();
})();
</script></body></html>
