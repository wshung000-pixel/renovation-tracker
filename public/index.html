<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f3"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="新家帳本">
<title>新家帳本｜裝潢與家電支出</title>
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;color:#27372f;background:#f7f7f3;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.wrap{max-width:890px;margin:auto;padding:24px 20px 125px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}.eyebrow{font-size:11px;letter-spacing:.17em;color:#8c958c;font-weight:700}.top h1{font-size:27px;letter-spacing:-.045em;margin:5px 0 0}.sync{border:1px solid #dae5dc;background:#eff7f0;border-radius:20px;padding:7px 11px;font-size:12px;color:#3e7351;white-space:nowrap}.hero{background:#234837;border-radius:23px;padding:26px;color:#fff;box-shadow:0 16px 35px #27463719}.hero small{color:#c6d9cb;font-size:13px}.money{font-size:clamp(32px,6vw,45px);font-weight:800;letter-spacing:-.035em;margin:10px 0 24px;overflow-wrap:anywhere}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;border-top:1px solid #ffffff30;padding-top:18px}.stats span{display:block;color:#c9dccd;font-size:12px;margin-bottom:7px}.stats strong{font-size:18px}.toolbar-head{display:flex;justify-content:space-between;align-items:center;margin:27px 0 13px}.toolbar-head h2{font-size:19px;letter-spacing:-.03em;margin:0}.sub{color:#8c958d;font-size:12px;margin-top:4px}.add{background:#234837;color:white;border:0;padding:12px 17px;border-radius:13px;font-weight:700}.tabs{display:grid;grid-template-columns:repeat(3,1fr);padding:5px;background:#e9ede7;border-radius:14px;gap:4px;margin-bottom:12px}.tabs button{border:0;background:transparent;border-radius:10px;padding:11px;color:#6e7a70;font-size:14px;font-weight:700}.tabs button.on{background:white;color:#234837;box-shadow:0 2px 6px #00000009}.filters{display:flex;gap:10px;margin-bottom:12px}.filters input,.filters select{min-width:0;background:white;border:1px solid #e1e7df;border-radius:13px;height:46px;padding:0 13px;outline-color:#659a78;font-size:15px}.filters input{flex:1}.filters select{max-width:133px}.list{background:white;border:1px solid #e5eae3;border-radius:17px;overflow:hidden}.entry{width:100%;display:flex;align-items:center;text-align:left;background:white;border:0;border-bottom:1px solid #eef0ec;padding:16px;gap:12px}.entry:last-child{border-bottom:0}.entry:active{background:#f5f8f3}.entry-text{flex:1;min-width:0}.entry-title{font-size:16px;font-weight:720;margin-bottom:5px;overflow-wrap:anywhere}.entry-note{font-size:12px;color:#8d978d;line-height:1.5;overflow-wrap:anywhere}.entry-amount{text-align:right;flex-shrink:0;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:3px 7px;margin-right:6px;background:#edf3ed;color:#49735a}.tag.unpaid{background:#fff2dd;color:#b07019}.empty{padding:55px 10px;text-align:center;color:#909b91}.small-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:19px}.link{background:none;border:0;color:#6c8272;text-decoration:underline;font-size:12px}.bottom-add{display:none}.overlay{position:fixed;inset:0;z-index:10;background:#17251c85;display:flex;align-items:center;justify-content:center;padding:17px}.dialog{width:100%;max-width:490px;max-height:94dvh;overflow:auto;background:white;border-radius:22px;padding:24px;box-shadow:0 25px 80px #0003}.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.dialog-head h2{margin:0;font-size:21px}.close{background:#eff1ed;border:0;border-radius:50%;width:34px;height:34px;font-size:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{margin:0 0 13px}.field label{display:block;color:#68766c;font-size:12px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{border:1px solid #dae3da;background:#fafbf9;border-radius:11px;width:100%;padding:12px;min-height:45px;font-size:16px;outline-color:#59936d}.field textarea{min-height:76px;resize:vertical}.buttons{display:flex;gap:9px;margin-top:13px}.btn{flex:1;border:1px solid #e1e8df;border-radius:12px;min-height:46px;font-size:15px;font-weight:700;background:white;color:#34523e}.btn.primary{background:#234837;color:white;border-color:#234837}.delete{display:block;margin:15px auto 0;background:none;border:0;color:#b44646;font-size:13px}.error{background:#fff0ee;color:#a34237;padding:9px 12px;font-size:12px;border-radius:10px;margin-top:12px}.notice{font-size:12px;color:#8d948c;margin-top:12px;line-height:1.5}@media(max-width:550px){.wrap{padding:20px 14px 110px}.top h1{font-size:24px}.hero{padding:23px 19px}.stats strong{font-size:15px}.stats span{font-size:11px}.toolbar-head .add{display:none}.bottom-add{display:block;position:fixed;z-index:3;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#234837;color:white;border:0;border-radius:99px;padding:16px 34px;box-shadow:0 10px 25px #173f2a50;font-weight:800;white-space:nowrap}.entry{padding:15px 12px;gap:8px}.entry-amount{font-size:15px}.grid{grid-template-columns:1fr 1fr}.dialog{padding:20px}.filters select{max-width:115px}}
</style></head><body>
<main class="wrap"><header class="top"><div><div class="eyebrow">HOME / EXPENSE TRACKER</div><h1>新家裝潢帳本</h1></div><div class="sync" id="sync">連線中</div></header>
<section class="hero"><small>已付款總金額 · NT$</small><div class="money" id="paidTotal">—</div><div class="stats"><div><span>裝潢支出</span><strong id="renovationTotal">—</strong></div><div><span>家電支出</span><strong id="applianceTotal">—</strong></div><div><span>待付款項目</span><strong id="unpaidCount">—</strong></div></div></section>
<div class="toolbar-head"><div><h2>支出明細</h2><div class="sub" id="count">載入中</div></div><button class="add" id="addTop">＋ 新增項目</button></div>
<nav class="tabs" id="tabs"><button data-type="全部" class="on">全部</button><button data-type="裝潢">裝潢</button><button data-type="家電">家電</button></nav>
<div class="filters"><input id="search" placeholder="搜尋名稱、備註、付款方式…" aria-label="搜尋費用項目"><select id="statusFilter" aria-label="付款狀態"><option value="全部">全部狀態</option><option value="未付款">未付款</option><option value="已付款">已付款</option></select></div>
<div class="list" id="list"><div class="empty">正在讀取資料…</div></div>
<div class="small-actions"><button class="link" id="export">匯出備份 JSON</button></div><div class="notice">點選項目可編輯。資料儲存於既有 Cloudflare 雲端空間。</div></main>
<button class="bottom-add" id="addBottom">＋ 新增項目</button><div id="modal"></div>
<script>
(function(){
'use strict';
var entries=[],ready=false,category='全部',status='全部',query='',editing=null,busy=false;
var $=function(id){return document.getElementById(id)};
var money=function(n){return '＄'+Number(n||0).toLocaleString('zh-TW')};
var safe=function(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
function sync(t,bad){$('sync').textContent=t;$('sync').style.color=bad?'#ab4c39':'#3e7351';$('sync').style.background=bad?'#fff0eb':'#eff7f0'}
function cache(){try{localStorage.setItem('renovation-entries',JSON.stringify(entries))}catch(e){}}
async function load(){
try{
var res=await fetch('/api/data',{cache:'no-store'});if(!res.ok)throw Error('無法連線');var data=await res.json();
if(!data.ok||!Array.isArray(data.entries))throw Error('資料格式異常');
entries=data.entries;ready=true;cache();sync('✓ 已連線');render();
}catch(e){
try{var old=JSON.parse(localStorage.getItem('renovation-entries')||'null');if(Array.isArray(old)){entries=old;sync('離線檢視',true)}else sync('無法載入',true)}catch(_){sync('無法載入',true)}
ready=false;render();
}}
async function save(next){
if(!ready||busy){alert('目前無法儲存，請確認雲端連線後重新整理。');return false}
busy=true;sync('儲存中…');
try{
var res=await fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({entries:next})});
var data=await res.json();if(!res.ok||!data.ok)throw Error('儲存失敗');
entries=next;cache();sync('✓ 已儲存');render();return true;
}catch(e){sync('儲存失敗',true);alert('儲存失敗，原始清單未更動。請稍後再試。');return false}
finally{busy=false}
}
function render(){
var paid=entries.filter(function(e){return e.paid}),sum=function(a){return a.reduce(function(n,e){return n+(Number(e.amount)||0)},0)};
$('paidTotal').textContent=money(sum(paid));
$('renovationTotal').textContent=money(sum(paid.filter(function(e){return e.type==='裝潢'})));
$('applianceTotal').textContent=money(sum(paid.filter(function(e){return e.type==='家電'})));
$('unpaidCount').textContent=entries.filter(function(e){return !e.paid}).length+' 項';
document.querySelectorAll('#tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.type===category)});
var list=entries.filter(function(e){return (category==='全部'||e.type===category)&&(status==='全部'||(status==='已付款'&&e.paid)||(status==='未付款'&&!e.paid))&&(!query||[e.item,e.notes,e.payment].some(function(v){return String(v||'').toLowerCase().includes(query)}))});
$('count').textContent='顯示 '+list.length+' 筆 · 共 '+entries.length+' 筆';
$('list').innerHTML=list.length?list.map(function(e){
return '<button class="entry" data-id="'+safe(e.id)+'"><div class="entry-text"><div class="entry-title">'+safe(e.item||'未命名')+'</div><div class="entry-note"><span class="tag '+(!e.paid?'unpaid':'')+'">'+(e.paid?'已付款':'未付款')+'</span>'+safe(e.payment||'')+(e.date?' · '+safe(e.date):'')+(e.notes?'<div style="margin-top:5px">'+safe(e.notes)+'</div>':'')+'</div></div><div class="entry-amount">'+(Number(e.amount)?money(e.amount):'—')+'</div><span style="font-size:19px;color:#a5b0a7">›</span></button>'
}).join(''):'<div class="empty">沒有符合條件的項目</div>';
document.querySelectorAll('.entry').forEach(function(b){b.onclick=function(){openForm(entries.find(function(e){return String(e.id)===b.dataset.id}))}});
}
function openForm(e){
if(!ready){alert('目前為離線檢視，無法修改。');return}
editing=e||null;
$('modal').innerHTML='<div class="overlay" id="overlay"><section class="dialog" role="dialog" aria-modal="true" aria-label="費用編輯"><div class="dialog-head"><h2>'+(e?'編輯項目':'新增項目')+'</h2><button class="close" id="close" aria-label="關閉">×</button></div><form id="form">'+
'<div class="field"><label for="item">項目名稱 *</label><input id="item" required maxlength="120"></div>'+
'<div class="grid"><div class="field"><label for="type">分類</label><select id="type"><option>裝潢</option><option>家電</option></select></div><div class="field"><label for="amount">金額 NT$</label><input type="number" id="amount" min="0" step="1" inputmode="numeric" placeholder="0"></div></div>'+
'<div class="grid"><div class="field"><label for="payment">付款方式</label><select id="payment"><option value="">未指定</option><option>轉帳</option><option>國泰信用卡</option><option>分期</option><option>現金</option><option>其他</option></select></div><div class="field"><label for="date">日期</label><input id="date" type="date"></div></div>'+
'<div class="field"><label for="paid">付款狀態</label><select id="paid"><option value="false">尚未付款</option><option value="true">已付款</option></select></div>'+
'<div class="field"><label for="notes">備註</label><textarea id="notes" placeholder="廠牌、型號、備註…"></textarea></div>'+
'<div class="buttons"><button type="button" class="btn" id="cancel">取消</button><button class="btn primary" id="submit">儲存</button></div></form>'+(e?'<button class="delete" id="delete">刪除此項目</button>':'')+'</section></div>';
var fields=['item','type','amount','payment','date','paid','notes'];
fields.forEach(function(k){$(k).value=e?(k==='paid'?String(!!e.paid):(e[k]==null?'':e[k])):({type:'家電',paid:'false'}[k]||'')});
function close(){$('modal').innerHTML='';editing=null}
$('close').onclick=close;$('cancel').onclick=close;
$('overlay').onclick=function(ev){if(ev.target===$('overlay'))close()};
$('form').onsubmit=async function(ev){
ev.preventDefault();var item=$('item').value.trim();if(!item)return;
var payload={id:e?e.id:String(Date.now())+'-'+Math.random().toString(36).slice(2,8),item:item,type:$('type').value,amount:Number($('amount').value)||0,payment:$('payment').value,date:$('date').value,paid:$('paid').value==='true',notes:$('notes').value};
var next=e?entries.map(function(x){return String(x.id)===String(e.id)?Object.assign({},x,payload):x}):entries.concat([payload]);
$('submit').disabled=true;var ok=await save(next);if(ok)close();else $('submit').disabled=false;
};
if(e)$('delete').onclick=async function(){if(!confirm('確定刪除「'+(e.item||'此項目')+'」？此操作無法復原。'))return;var ok=await save(entries.filter(function(x){return String(x.id)!==String(e.id)}));if(ok)close()};
$('item').focus();
}
$('tabs').onclick=function(ev){if(ev.target.dataset.type){category=ev.target.dataset.type;render()}};
$('search').oninput=function(ev){query=ev.target.value.trim().toLowerCase();render()};
$('statusFilter').onchange=function(ev){status=ev.target.value;render()};
$('addTop').onclick=$('addBottom').onclick=function(){openForm(null)};
$('export').onclick=function(){var blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),entries:entries},null,2)],{type:'application/json'});var url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='新家帳本備份-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(function(){URL.revokeObjectURL(url)},300)};
load();
})();
</script></body></html>
