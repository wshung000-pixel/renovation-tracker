<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>窗簾費用匯入</title><style>body{margin:0;background:#f7f7f3;color:#294031;font-family:-apple-system,"PingFang TC",sans-serif}.wrap{max-width:600px;margin:auto;padding:24px 16px}article{background:white;border:1px solid #e1e7df;border-radius:18px;padding:20px;margin:16px 0}h1{font-size:24px}.line{display:flex;justify-content:space-between;margin:13px 0;gap:10px}.muted{color:#728274;font-size:13px;line-height:1.6}.warn{background:#fff2da;color:#8d5f1f;padding:12px;border-radius:10px}.good{background:#e7f3e9;padding:12px;border-radius:10px;color:#316d44}button{background:#254b37;color:white;width:100%;padding:15px;border:0;border-radius:12px;font-size:16px;font-weight:700}button:disabled{opacity:.45}a{color:#315d44}</style></head><body><main class="wrap"><a href="/">← 返回帳本</a><h1>窗簾費用匯入</h1><article><div class="line"><span>已付訂金</span><strong>NT$10,000</strong></div><div class="line"><span>未付尾款</span><strong>NT$27,143</strong></div><hr><div class="line"><b>窗簾總價</b><b>NT$37,143</b></div><p class="muted">兩筆歸類為家具；付款日期及方式暫不填寫。</p></article><article><h2>匯入前核對</h2><div id="status">正在讀取雲端紀錄…</div></article><article><button id="submit" disabled>檢查中…</button><p class="muted" id="message">只有確認沒有金額衝突才會開放；匯入前會備份現有紀錄。</p></article></main><script>
const btn=document.getElementById('submit'),st=document.getElementById('status'),msg=document.getElementById('message');
async function check(){btn.disabled=true;try{const r=await fetch('/api/curtains-import',{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw Error('資料讀取失敗');if(d.issues.length){st.className='warn';st.textContent='暫停匯入：'+d.issues.join('；');btn.textContent='需要核對';return;}st.className='good';st.textContent='已有 '+d.existing+' 筆，尚缺 '+d.missing+' 筆。'+(d.others.length?'另有原始窗簾項目，金額為 0，將予以保留。':'');btn.textContent=d.missing?'確認匯入 '+d.missing+' 筆':'已全部登記';btn.disabled=!d.missing;}catch(e){st.className='warn';st.textContent='無法檢查雲端資料，未變更紀錄';btn.textContent='檢查失敗';}}
btn.onclick=async()=>{if(!confirm('新增窗簾訂金 NT$10,000（已付）及尾款 NT$27,143（未付）？'))return;btn.disabled=true;msg.textContent='正在備份並匯入…';try{const r=await fetch('/api/curtains-import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({confirm:'curtains-37143'})}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'匯入失敗');msg.textContent='匯入完成，新增 '+d.added+' 筆。請返回帳本確認。';await check();}catch(e){msg.textContent='尚未確認完成：'+e.message+'。請先檢查現有紀錄。';await check();}};check();
</script></body></html>
