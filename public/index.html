function EntryForm({initial, onSave, onCancel}) {
  const empty={item:"",amount:"",payment:"",date:"",notes:"",type:"家電",paid:false};
  const [form,setForm]=useState(initial||empty);

// ── Draggable list ────────────────────────────────────────────────
function DraggableList({items, onReorder, onEdit}) {
  const dragIndex = useRef(null);
  const [dragOver, setDragOver] = useState(null);

  // Touch drag state
  const touchState = useRef({active:false, startIndex:null, currentIndex:null, startY:0});
  const listRef = useRef(null);

  function getRowEls() {
    return listRef.current ? Array.from(listRef.current.querySelectorAll('[data-idx]')) : [];
  }
  function indexFromY(y) {
    const rows = getRowEls();
    for (let i = 0; i < rows.length; i++) {
      const rect = rows[i].getBoundingClientRect();
      if (y < rect.bottom) return i;
    }
    return rows.length - 1;
  }

  // Mouse drag
  function onDragStart(i) { dragIndex.current = i; }
  function onDragEnter(i) { setDragOver(i); }
  function onDrop(i) {
    if (dragIndex.current === null || dragIndex.current === i) { setDragOver(null); return; }
    const arr = [...items];
    const [moved] = arr.splice(dragIndex.current, 1);
    arr.splice(i, 0, moved);
    onReorder(arr);
    dragIndex.current = null;
    setDragOver(null);
  }
  function onDragEnd() { dragIndex.current = null; setDragOver(null); }

  // Touch drag
  function onTouchStart(e, i) {
    const t = touchState.current;
    t.timer = setTimeout(() => {
      t.active = true;
      t.startIndex = i;
      t.currentIndex = i;
      t.startY = e.touches[0].clientY;
      setDragOver(i);
    }, 350); // long press
  }
  function onTouchMove(e) {
    const t = touchState.current;
    if (!t.active) { clearTimeout(t.timer); return; }
    e.preventDefault();
    const y = e.touches[0].clientY;
    const idx = indexFromY(y);
    if (idx !== t.currentIndex) { t.currentIndex = idx; setDragOver(idx); }
  }
  function onTouchEnd() {
    const t = touchState.current;
    clearTimeout(t.timer);
    if (!t.active) return;
    const from = t.startIndex, to = t.currentIndex;
    t.active = false; t.startIndex = null; t.currentIndex = null;
    setDragOver(null);
    if (from !== to && from !== null && to !== null) {
      const arr = [...items];
      const [moved] = arr.splice(from, 1);
      arr.splice(to, 0, moved);
      onReorder(arr);
    }
  }

  const fmtMoney = n => n > 0 ? `$${Number(n).toLocaleString()}` : "—";
  const fmtDate  = d => d ? d.replace(/-/g, "/") : "";

  return (
    <div ref={listRef}>
      {items.map((entry, i) => (
        <div
          key={entry.id}
          data-idx={i}
          draggable
          onDragStart={()=>onDragStart(i)}
          onDragEnter={()=>onDragEnter(i)}
          onDragOver={e=>e.preventDefault()}
          onDrop={()=>onDrop(i)}
          onDragEnd={onDragEnd}
          onTouchStart={e=>onTouchStart(e,i)}
          onTouchMove={onTouchMove}
          onTouchEnd={onTouchEnd}
          onClick={()=>onEdit(entry)}
          className={"entry-row"+(dragOver===i?" drag-over":"")}
          style={{padding:"13px 16px",cursor:"pointer",borderTop:"1px solid #f3f4f6",display:"flex",alignItems:"center",gap:12,background:"#fff",userSelect:"none"}}
        >
          {/* drag handle */}
          <div style={{flexShrink:0,display:"flex",flexDirection:"column",gap:3,opacity:0.25,paddingRight:2}}>
            {[0,1,2].map(n=><div key={n} style={{width:16,height:2,borderRadius:2,background:"#1a1a2e"}}/>)}
          </div>

          <div style={{flex:1,minWidth:0}}>
            <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:2}}>
              <span style={{fontWeight:700,fontSize:15,color:"#1a1a2e"}}>{entry.item}</span>
              {!entry.paid && <span style={{fontSize:10,background:"#fef3c7",color:"#d97706",padding:"1px 6px",borderRadius:4,fontWeight:600}}>未付款</span>}
            </div>
            <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
              {entry.payment && <PaymentBadge method={entry.payment}/>}
              {entry.date && <span style={{fontSize:11,color:"#9ca3af"}}>{fmtDate(entry.date)}</span>}
              {entry.notes && <span style={{fontSize:11,color:"#c4b5a5",fontStyle:"italic"}}>📎 {entry.notes}</span>}
            </div>
          </div>

          <div style={{fontSize:16,fontWeight:800,color:entry.amount>0?"#1a1a2e":"#d1d5db",flexShrink:0}}>
            {fmtMoney(entry.amount)}
          </div>
        </div>
      ))}
      {items.length===0 && <div style={{padding:"32px 20px",textAlign:"center",color:"#d1d5db",fontSize:14}}>沒有項目</div>}
    </div>
  );
}

// ── Section with header ───────────────────────────────────────────
function Section({label, color, items, onReorder, onEdit}) {
  const total = items.filter(e=>e.paid&&e.amount>0).reduce((s,e)=>s+Number(e.amount),0);
  return (
    <div style={{marginBottom:0}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 16px 6px",background:"#f9fafb",borderTop:"1px solid #f0f0f0"}}>

          <div style={{width:8,height:8,borderRadius:"50%",background:color}}/>

          <span style={{fontSize:11,background:"#f3f4f6",color:"#9ca3af",borderRadius:10,padding:"1px 7px",fontWeight:600}}>{items.length}</span>
        </div>
        {total>0&&<span style={{fontSize:12,fontWeight:700,color:"#374151"}}>${total.toLocaleString()}</span>}
      </div>
      <DraggableList items={items} onReorder={onReorder} onEdit={onEdit}/>
    </div>
  );
}

// ── Main App ──────────────────────────────────────────────────────
function App() {
  const [entries,setEntries]=useState(()=>{
    try{const s=localStorage.getItem("renovation-entries");return s?JSON.parse(s):initialData;}catch{return initialData;}
  });
  const [showAdd,setShowAdd]=useState(false);
  const [editEntry,setEditEntry]=useState(null);
  const [tab,setTab]=useState("全部");
  const [search,setSearch]=useState("");
  const [paymentFilter,setPaymentFilter]=useState("全部狀態");       // 全部 | 裝潢 | 家電
  const [applianceTab,setApplianceTab]=useState("全部"); // 全部 | 已付款 | 未付款
  const [syncStatus,setSyncStatus]=useState("loading");
  const saveTimer=useRef(null);
  const isFirstLoad=useRef(true);

  // KV sync
  useEffect(()=>{
    fetch(API).then(r=>r.json()).then(({ok,entries:remote})=>{
      if(ok&&remote&&remote.length>0){setEntries(remote);localStorage.setItem("renovation-entries",JSON.stringify(remote));}
      else if(ok&&remote&&remote.length===0){saveToKV(entries);}
      setSyncStatus("synced");
    }).catch(()=>setSyncStatus("local")).finally(()=>{isFirstLoad.current=false;});
  },[]);

  function saveToKV(data){
    setSyncStatus("syncing");
    fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({entries:data})})
      .then(r=>r.json()).then(({ok})=>setSyncStatus(ok?"synced":"error")).catch(()=>setSyncStatus("error"));
  }
  useEffect(()=>{
    localStorage.setItem("renovation-entries",JSON.stringify(entries));
    if(isFirstLoad.current) return;
    clearTimeout(saveTimer.current);
    saveTimer.current=setTimeout(()=>saveToKV(entries),800);
    return ()=>clearTimeout(saveTimer.current);
  },[entries]);

  const paidTotal = useMemo(()=>entries.filter(e=>e.paid&&e.amount>0).reduce((s,e)=>s+Number(e.amount),0),[entries]);
  const unpaidCount = useMemo(()=>entries.filter(e=>!e.paid).length,[entries]);

  // Reorder helpers — preserve global order within a filtered subset
  function reorderSubset(newSubset) {
    // replace items in their original positions with the reordered subset
    const subIds = new Set(newSubset.map(e=>e.id));
    const result = [...entries];
    const positions = result.map((e,i)=>subIds.has(e.id)?i:null).filter(i=>i!==null);
    positions.forEach((pos,i)=>{ result[pos]=newSubset[i]; });
    setEntries(result);
  }

  const renovation = useMemo(()=>entries.filter(e=>e.type==="裝潢"),[entries]);
  const appliance  = useMemo(()=>entries.filter(e=>e.type==="家電"),[entries]);
  const appliancePaid   = useMemo(()=>appliance.filter(e=>e.paid),[appliance]);
  const applianceUnpaid = useMemo(()=>appliance.filter(e=>!e.paid),[appliance]);

  const handleAdd=(form)=>{
    if(!form.item.trim()) return;
    setEntries(prev=>[...prev,{...form,id:String(Date.now()),amount:Number(form.amount)||0}]);
    setShowAdd(false);
  };
  const handleEdit=(form)=>{
    setEntries(prev=>prev.map(e=>e.id===editEntry.id?{...e,...form,amount:Number(form.amount)||0}:e));
    setEditEntry(null);
  };
  const handleDelete=(id)=>{setEntries(prev=>prev.filter(e=>e.id!==id));setEditEntry(null);};

  const badge={
    loading:{bg:"#f3f4f6",color:"#9ca3af",icon:"⟳",text:"載入中",spin:true},
    local:  {bg:"#fef3c7",color:"#d97706",icon:"⚠",text:"本機"},
    syncing:{bg:"#eff6ff",color:"#2563eb",icon:"⟳",text:"同步中",spin:true},
    synced: {bg:"#f0fdf4",color:"#16a34a",icon:"✓",text:"已同步"},
    error:  {bg:"#fef2f2",color:"#dc2626",icon:"!",text:"失敗"},
  }[syncStatus];

  const TABS = ["全部","裝潢","家電"];

  const shown = entries.filter(e=>(tab==="全部"||e.type===tab) && (paymentFilter==="全部狀態"||(paymentFilter==="已付款"?e.paid:!e.paid)) && (!search.trim()||[e.item,e.notes,e.payment].some(v=>String(v||"").toLowerCase().includes(search.trim().toLowerCase()))));
  const paidCount=entries.filter(e=>e.paid).length;
  const typeTotal=t=>entries.filter(e=>e.type===t&&e.paid).reduce((v,e)=>v+(Number(e.amount)||0),0);
  return (
    <div style={{minHeight:"100vh",background:"#f8f7f4"}}>
      <main className="app-shell">
        <header className="app-header">
          <div><div className="eyebrow">HOME · FINANCES</div><h1 className="app-title">新家裝潢帳本</h1></div>
          <span className="status-pill" style={{background:badge.bg,color:badge.color}}><span className={badge.spin?"spin":""}>{badge.icon}</span> {badge.text}</span>
        </header>
        <section className="hero-card">
          <div className="hero-label">已付款總金額 · TWD</div>
          <div className="hero-total">$ {paidTotal.toLocaleString("zh-TW")}</div>
          <div className="hero-footer">
            <div><div className="hero-meta">已付款</div><div className="hero-value">{paidCount} <span style={{fontSize:12,fontWeight:400}}>筆</span></div></div>
            <div><div className="hero-meta">待付款</div><div className="hero-value">{unpaidCount} <span style={{fontSize:12,fontWeight:400}}>筆</span></div></div>
          </div>
        </section>
        <div className="section-head">
          <div><h2 className="section-title">支出明細</h2><div className="section-sub">裝潢 $ {typeTotal("裝潢").toLocaleString()} · 家電 $ {typeTotal("家電").toLocaleString()}</div></div>
          <span style={{fontSize:12,color:"#89948a"}}>{shown.length} / {entries.length} 筆</span>
        </div>
        <nav className="tabs" aria-label="費用類別">
          {["全部","裝潢","家電"].map(t=><button key={t} className={"tab"+(tab===t?" active":"")} onClick={()=>setTab(t)}>{t}</button>)}
        </nav>
        <div className="toolbar">
          <label className="search-box"><span aria-hidden="true" style={{fontSize:18,color:"#a1aaa1",marginRight:9}}>⌕</span><input aria-label="搜尋項目" value={search} onChange={e=>setSearch(e.target.value)} placeholder="搜尋項目、備註…"/></label>
          <select className="filter-select" aria-label="付款狀態" value={paymentFilter} onChange={e=>setPaymentFilter(e.target.value)}><option>全部狀態</option><option>已付款</option><option>未付款</option></select>
        </div>
        <section className="list-card" aria-label="費用項目">
          {shown.length ? <DraggableList items={shown} onReorder={reorderSubset} onEdit={setEditEntry}/> : <div className="empty-hint">找不到符合條件的項目<br/><button onClick={()=>{setSearch("");setPaymentFilter("全部狀態");setTab("全部");}} style={{marginTop:13,border:0,background:"transparent",color:"#386d53",fontWeight:700,cursor:"pointer"}}>清除篩選</button></div>}
        </section>
      </main>
      <button className="fab-new" onClick={()=>setShowAdd(true)}>＋ 新增費用</button>
      {showAdd&&<Modal title="新增費用項目" onClose={()=>setShowAdd(false)}><EntryForm onSave={handleAdd} onCancel={()=>setShowAdd(false)}/></Modal>}
      {editEntry&&<Modal title="編輯項目" onClose={()=>setEditEntry(null)}>
        <EntryForm initial={editEntry} onSave={handleEdit} onCancel={()=>setEditEntry(null)}/>
        <button onClick={()=>{if(window.confirm("確定刪除此項目？"))handleDelete(editEntry.id);}} style={{width:"100%",marginTop:10,padding:"12px",borderRadius:12,border:"1px solid #fee2e2",background:"#fff8f8",color:"#dc2626",fontSize:14,fontWeight:600,cursor:"pointer"}}>刪除此項目</button>
      </Modal>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
